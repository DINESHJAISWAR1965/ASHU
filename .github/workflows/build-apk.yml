name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          npm install
          pip install pillow

      - name: www folder banao
        run: |
          mkdir -p www/tpl
          cp index.html app.js www/
          cp bazaar-khabar*.html www/tpl/

      - name: Android project banao
        run: |
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' $M
          sed -i 's/<application/<application android:usesCleartextTraffic="false"/' $M
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          mkdir -p android/app/src/main/java/in/bqube/bazaarkhabar
          cp SaveFilePlugin.java MainActivity.java android/app/src/main/java/in/bqube/bazaarkhabar/
          python3 make_icons.py android/app/src/main/res

      - name: Permanent signing key
        uses: actions/cache@v4
        with:
          path: release.jks
          key: bazaar-khabar-release-keystore-v1

      - name: Key banao (pehli baar)
        run: |
          if [ ! -f release.jks ]; then
            keytool -genkeypair -v -keystore release.jks -alias bazaarkhabar \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "${{ secrets.KS_PASS || 'bazaarkhabar-ks' }}" \
              -dname "CN=Dinesh Jaiswar, OU=Bqube Investment, O=Bqube Investment, L=Indore, ST=Madhya Pradesh, C=IN"
          fi

      - name: Release APK build
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Align aur sign karo
        env:
          KS_PASS: ${{ secrets.KS_PASS || 'bazaarkhabar-ks' }}
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          OUT=android/app/build/outputs/apk/release
          UNSIGNED=$(ls $OUT/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks release.jks --ks-pass env:KS_PASS --key-alias bazaarkhabar --out BazaarKhabar.apk aligned.apk
          $BT/apksigner verify --print-certs BazaarKhabar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BazaarKhabar-apk
          path: BazaarKhabar.apk

      - name: Key ka backup
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-backup
          path: release.jks
          retention-days: 90

      - name: Release banao
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" BazaarKhabar.apk \
            --title "Bazaar Khabar APK #${{ github.run_number }}" \
            --notes "Phone mein BazaarKhabar.apk download karke install karein."
